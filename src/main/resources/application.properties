quarkus.application.name=todo-api
quarkus.http.port=8080
quarkus.http.root-path=/

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:todo_user}
quarkus.datasource.password=${DB_PASSWORD:todo_password}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/todo_db}

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:todo_test;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
